<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Display Large Text – Large-Type.com</title>
    <meta name="viewport" content="width=device-width, user-scalable=no">

    <meta name="description" content="Display &amp; share text in a large font directly from your browser. Read phone numbers, passwords, IP addresses, etc from across the room.">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Large-type utility website">
    <meta name="twitter:description" content="Display &amp; share text in a large font directly from your browser. Read phone numbers, passwords, IP addresses, etc from across the room.">
    <meta name="twitter:creator" content="@dbader_org">
    <meta name="twitter:image" content="http://large-type.com/twitter-card.png?v2">

    <meta property="og:title" content="Large-type utility website">
    <meta property="og:type" content="website">
    <meta property="og:url" content="http://large-type.com/">
    <meta property="og:description" content="Display &amp; share text in a large font directly from your browser. Read phone numbers, passwords, IP addresses, etc from across the room.">
    <meta property="og:image" content="http://large-type.com/twitter-card.png?v2">

    <link rel="icon" type="image/png" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;700&family=Indie+Flower&family=Cardo:ital,wght@0,400;0,700;1,400&family=Birthstone&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>

    <!-- Content -->
    <div class="main">
      <span class="inputarea">
        <input type="text" class="inputbox" tabindex="1" placeholder="Enter your text here" />
      </span>

      <!-- Word Image Cards -->
      <div class="word-cards-container">
        <template id="word-card-template">
          <div class="word-card">
            <img class="word-image" src="" alt="">
          </div>
        </template>
      </div>

      <ul class="text">
        <template id="charbox-template">
          <li class="charbox">
            <span class="char"></span>
          </li>
        </template>
      </ul>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
      <h2>Settings</h2>
      <p>Press <strong>Ctrl+Shift+E</strong> to toggle this menu</p>

      <div style="margin-top: 20px;">
        <label for="font-select" style="display: block; margin-bottom: 8px;">
          <strong>Display Font:</strong>
        </label>
        <select id="font-select" style="width: 100%; padding: 8px; font-size: 16px; border-radius: 3px; border: 1px solid var(--input-color);">
          <option value="atkinson">Atkinson Hyperlegible Mono (Sans Serif)</option>
          <option value="indie">Indie Flower (Handwritten)</option>
          <option value="cardo">Cardo (Serif)</option>
          <option value="birthstone">Birthstone (Cursive)</option>
        </select>
      </div>

      <div style="margin-top: 20px;">
        <label for="case-select" style="display: block; margin-bottom: 8px;">
          <strong>Letter Case:</strong>
        </label>
        <select id="case-select" style="width: 100%; padding: 8px; font-size: 16px; border-radius: 3px; border: 1px solid var(--input-color);">
          <option value="both">As Typed (Default)</option>
          <option value="uppercase">UPPERCASE</option>
          <option value="lowercase">lowercase</option>
        </select>
      </div>

      <div style="margin-top: 20px;">
        <label style="display: block; margin-bottom: 8px;">
          <strong>Word Images:</strong>
        </label>
        <button id="reload-manifest" style="width: 100%; padding: 8px; font-size: 16px; cursor: pointer;">
          Reload Image Manifest
        </button>
        <p id="manifest-status" style="margin-top: 8px; font-size: 14px; color: #666;"></p>
      </div>

      <button id="close-settings">Close</button>
    </div>

    <script src="scripts.js"></script>
  </body>
</html>
